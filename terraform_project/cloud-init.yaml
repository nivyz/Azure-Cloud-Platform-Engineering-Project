#cloud-config
package_update: true
packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Terraform Azure VM Lab</title>
      </head>
      <body>
        <h1>Terraform Azure VM Lab</h1>
        <p>${vm_name} was configured with cloud-init.</p>
      </body>
      </html>

runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
